<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1c1a19">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Atıl Hukuk">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<title>Atıl Hukuk Hesaplama Araçları</title>
<style>
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #1c1a19; color: #fff; font-family: Inter, -apple-system, "Helvetica Neue", Arial, sans-serif; }
[hidden] { display: none !important; }
.kilit { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  background: radial-gradient(ellipse 80% 55% at 50% 42%, #2a2622 0%, #1c1a19 70%); padding: calc(env(safe-area-inset-top, 0px) + 40px) 28px calc(env(safe-area-inset-bottom, 0px) + 60px); position: relative; }
.kilit::before { content: ""; position: absolute; inset: calc(env(safe-area-inset-top, 0px) + 14px) 14px calc(env(safe-area-inset-bottom, 0px) + 14px); border: 1px solid rgba(184, 150, 74, .38); pointer-events: none; }
.kilit img { mix-blend-mode: lighten; width: 132px; height: 132px; display: block; }
.kilit h1 { margin: 6px 0 0; font-family: "Libre Baskerville", Baskerville, Georgia, serif; font-size: 19px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.kilit .cizgi { width: 44px; height: 1px; background: #b8964a; margin-top: 20px; }
.kilit b { margin-top: 18px; font-size: 11.5px; font-weight: 600; letter-spacing: .34em; padding-left: .34em; text-transform: uppercase; color: #b8964a; }
form { margin-top: 38px; width: min(300px, 100%); display: flex; flex-direction: column; gap: 12px; }
label { font-size: 10.5px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: #b8964a; text-align: left; }
input { width: 100%; min-height: 48px; padding: 10px 12px; font: inherit; font-size: 16px; color: #fff; background: #24211e; border: 1px solid #4a453e; border-radius: 0; -webkit-appearance: none; appearance: none; }
input:focus { outline: 2px solid #b8964a; outline-offset: 2px; }
button { min-height: 48px; padding: 12px 34px; font: inherit; font-size: 12.5px; font-weight: 600; letter-spacing: .2em; padding-left: calc(34px + .2em); text-transform: uppercase; background: #b8964a; color: #1c1a19; border: 1px solid #b8964a; border-radius: 0; cursor: pointer; }
button:disabled { opacity: .6; cursor: default; }
button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.durum { min-height: 20px; margin: 6px 0 0; font-size: 13px; color: #f0907f; }
.durum.bilgi { color: #a59e92; }
.alt { position: absolute; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 36px); font-size: 11px; color: #8f887c; padding-inline: 32px; margin: 0; }
</style>
</head>
<body>
<main class="kilit">
  <img src="icon-512.png" alt="">
  <h1>Atıl Hukuk Bürosu</h1>
  <span class="cizgi" aria-hidden="true"></span>
  <b>Hesaplama Araçları</b>
  <form id="giris-formu" hidden autocomplete="off">
    <label for="parola">Parola</label>
    <input type="password" id="parola" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required>
    <button type="submit" id="gir">Giriş</button>
    <p class="durum" id="durum" role="alert"></p>
  </form>
  <p class="durum bilgi" id="bekle">Açılıyor…</p>
  <p class="alt">Bu uygulama yalnızca Atıl Hukuk Bürosu'nun izin verdiği kişilerin kullanımı içindir.</p>
</main>
<script>
/* İçerik şifreli olarak yayımlanır (icerik.json). Parola, kilit.json'daki özel anahtarı açar; o da içeriğin anahtarını çözer.
   Doğru parola bir kez girildikten sonra bu cihazda hatırlanır. */
(function () {
  var SAKLA = "atil-hesaplama-anahtar", form = document.getElementById("giris-formu"), durum = document.getElementById("durum"),
      bekle = document.getElementById("bekle"), giris = document.getElementById("parola"), dugme = document.getElementById("gir"), kilit = null, icerik = null;
  function b64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function b64yaz(u) { var s = ""; u = new Uint8Array(u); for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
  function getir(ad) { return fetch(ad, { cache: "no-store" }).then(function (r) { if (!r.ok) throw new Error(ad); return r.json(); }); }
  function coz(ham) { /* ham: paroladan türetilmiş 32 baytlık anahtar */
    var S = crypto.subtle;
    return S.importKey("raw", ham, "AES-GCM", false, ["decrypt"])
      .then(function (k) { return S.decrypt({ name: "AES-GCM", iv: b64(kilit.iv) }, k, b64(kilit.ozel)); })
      .then(function (p) { return S.importKey("pkcs8", p, { name: "RSA-OAEP", hash: "SHA-256" }, false, ["decrypt"]); })
      .then(function (oz) { return S.decrypt({ name: "RSA-OAEP" }, oz, b64(icerik.anahtar)); })
      .then(function (ic) { return S.importKey("raw", ic, "AES-GCM", false, ["decrypt"]); })
      .then(function (k) { return S.decrypt({ name: "AES-GCM", iv: b64(icerik.iv) }, k, b64(icerik.veri)); })
      .then(function (d) { return new TextDecoder("utf-8").decode(d); });
  }
  function ac(html, atla) { if (atla) window.__girisAtla = true; document.open(); document.write(html); document.close(); }
  function sor(mesaj) { bekle.hidden = true; form.hidden = false; durum.textContent = mesaj || ""; dugme.disabled = false; try { giris.focus(); } catch (e) {} }
  function kayitli() { try { var j = JSON.parse(localStorage.getItem(SAKLA) || "null"); return j && j.kimlik === kilit.kimlik ? j.a : null; } catch (e) { return null; } }
  if (!(window.crypto && crypto.subtle)) { bekle.textContent = "Bu tarayıcı desteklenmiyor. Sayfayı Safari ya da Chrome'un güncel sürümüyle açın."; return; }
  Promise.all([getir("kilit.json"), getir("icerik.json")]).then(function (r) {
    kilit = r[0]; icerik = r[1];
    if (kilit.kimlik !== icerik.kimlik) { bekle.textContent = "Uygulama güncelleniyor. Birkaç dakika sonra yeniden deneyin."; return; }
    var a = kayitli(), eski = false;
    try { eski = !a && !!localStorage.getItem(SAKLA); if (eski) localStorage.removeItem(SAKLA); } catch (e) {}
    if (!a) return sor(eski ? "Parola değişti. Yeni parolayı girin." : "");
    coz(b64(a)).then(function (h) { ac(h, false); }, function () { try { localStorage.removeItem(SAKLA); } catch (e) {} sor("Parola değişti. Yeni parolayı girin."); });
  }, function () { bekle.textContent = "İçerik yüklenemedi. İnternet bağlantınızı kontrol edip sayfayı yenileyin."; });
  form.addEventListener("submit", function (e) {
    e.preventDefault(); var p = giris.value; if (!p || !kilit) return;
    dugme.disabled = true; durum.textContent = ""; var S = crypto.subtle, ham;
    S.importKey("raw", new TextEncoder().encode(p.normalize("NFC")), "PBKDF2", false, ["deriveBits"])
      .then(function (k) { return S.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: b64(kilit.tuz), iterations: kilit.tur }, k, 256); })
      .then(function (bits) { ham = bits; return coz(bits); })
      .then(function (h) { try { localStorage.setItem(SAKLA, JSON.stringify({ kimlik: kilit.kimlik, a: b64yaz(ham) })); } catch (e2) {} ac(h, true); },
            function () { giris.value = ""; sor("Parola hatalı."); });
  });
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) { try { navigator.serviceWorker.register("sw.js").catch(function () {}); } catch (e) {} }
})();
</script>
</body>
</html>
