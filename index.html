*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #1c1a19; color: #fff; font-family: Inter, "Helvetica Neue", Arial, sans-serif; font-size: 15px; line-height: 1.55; }
[hidden] { display: none !important; }
:root { --ust: env(safe-area-inset-top, 0px); }
.giris { --g: min(264px, 66vw); position: fixed; top: 0; left: 0; right: 0; height: var(--ekran, 100%); z-index: 50; color: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: radial-gradient(ellipse 80% 55% at 50% 44%, #2a2622 0%, #1c1a19 70%); padding: calc(var(--ust) + 40px) 28px calc(env(safe-area-inset-bottom, 0px) + 96px);
  text-align: center; cursor: pointer; transition: opacity .32s ease; box-shadow: 0 0 0 240px #1c1a19; }
.giris::before { content: ""; position: absolute; inset: calc(var(--ust) + 14px) 14px calc(env(safe-area-inset-bottom, 0px) + 14px); border: 1px solid rgba(184, 150, 74, .38); pointer-events: none; }
.giris.kapaniyor { opacity: 0; pointer-events: none; }
.giris .kes { overflow: hidden; flex: none; }
.giris .kes img { mix-blend-mode: lighten; display: block; width: var(--g); max-width: none; height: auto; }
.giris .amblem { width: calc(var(--g) * 120 / 450); height: calc(var(--g) * 148 / 450); }
.giris .amblem img { margin: calc(var(--g) * -2 / 450) 0 0 calc(var(--g) * -139.5 / 450); }
.giris .yazi { --y: calc(var(--g) * .78); width: calc(var(--y) * 446 / 450); height: calc(var(--y) * 44 / 450); margin-top: calc(var(--g) * 26 / 450); opacity: .94; }
.giris .yazi img { width: var(--y); margin: calc(var(--y) * -168 / 450) 0 0 calc(var(--y) * -1.5 / 450); }
.giris .cizgi { width: 44px; height: 1px; background: #b8964a; margin-top: 24px; }
.giris b { margin-top: 20px; font-size: 11.5px; font-weight: 600; letter-spacing: .34em; text-transform: uppercase; color: #b8964a; padding-left: .34em; }
.giris button { margin-top: 44px; min-height: 48px; min-width: 196px; padding: 12px 34px; font: inherit; font-size: 12.5px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase;
  padding-left: calc(34px + .2em); background: none; color: #e9dcc0; border: 1px solid #b8964a; border-radius: 0; cursor: pointer; transition: background .18s ease, color .18s ease; }
.giris button:hover, .giris button:active { background: #b8964a; color: #1c1a19; }
.giris small { position: absolute; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 32px); font-size: 11px; line-height: 1.5; letter-spacing: .04em; color: #8f887c; padding-inline: 32px; display: flex; flex-direction: column; gap: 6px; }
.giris small i { font-style: normal; letter-spacing: 0; color: #7d766b; }
.giris { cursor: default; }
@keyframes gel { from { opacity: 0; } to { opacity: 1; } }
#devam, #veri { animation: gel .45s ease both; }
@media (prefers-reduced-motion: reduce) { #devam, #veri { animation: none; } }
.giris .bekle { margin: 44px 0 0; min-height: 48px; line-height: 48px; font-size: 13px; color: #a59e92; }
form { margin-top: 30px; width: min(300px, 100%); display: flex; flex-direction: column; gap: 12px; }
label { font-size: 10.5px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: #b8964a; text-align: left; }
input { width: 100%; min-height: 48px; padding: 10px 12px; font: inherit; font-size: 16px; color: #fff; background: #24211e; border: 1px solid #4a453e; border-radius: 0; -webkit-appearance: none; appearance: none; }
input:focus { outline: 2px solid #b8964a; outline-offset: 2px; }
button { min-height: 48px; padding: 12px 34px; font: inherit; font-size: 12.5px; font-weight: 600; letter-spacing: .2em; padding-left: calc(34px + .2em); text-transform: uppercase; background: #b8964a; color: #1c1a19; border: 1px solid #b8964a; border-radius: 0; cursor: pointer; }
.giris form button { margin-top: 0; min-width: 0; background: #b8964a; color: #1c1a19; }
button:disabled { opacity: .6; cursor: default; }
button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.durum { min-height: 20px; margin: 6px 0 0; font-size: 13px; color: #f0907f; }
.durum.bilgi { color: #a59e92; }
.eski-alt { position: absolute; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 36px); font-size: 11px; color: #8f887c; padding-inline: 32px; margin: 0; }
